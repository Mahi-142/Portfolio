<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glass Box Effect Demo</title>
<style>

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 40%),
      linear-gradient(160deg, #a9d6f5 0%, #4a90c4 45%, #1c4a70 100%);
  }

  /* ============================================
     THE GLASS BOX — this is the reusable part
  ============================================ */
  .glass-box {
    position: relative;
    max-width: 480px;
    padding: 2rem;
    border-radius: 22px;
    color: #eaf6ff;

    /* translucent blue-tinted glass fill */
    background: linear-gradient(
      160deg,
      rgba(255, 255, 255, 0.35) 0%,
      rgba(150, 200, 240, 0.18) 40%,
      rgba(40, 90, 140, 0.35) 100%
    );

    /* frosted glass blur — the key ingredient */
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    /* thin bright edge, like light catching the rim of glass */
    border: 1px solid rgba(255, 255, 255, 0.55);

    /* outer glow + inner highlight */
    box-shadow:
      0 10px 40px rgba(10, 40, 70, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 -20px 30px -20px rgba(0, 0, 0, 0.25);

    overflow: hidden;
  }

  /* the glossy highlight band across the top — this sells the "glass" look */
  .glass-box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.55) 0%,
      rgba(255, 255, 255, 0.08) 80%,
      transparent 100%
    );
    border-radius: 22px 22px 50% 50% / 22px 22px 35% 35%;
    pointer-events: none;
  }

  .glass-box h2 {
    margin: 0 0 0.75rem;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .glass-box p {
    margin: 0;
    line-height: 1.6;
    color: rgba(234, 246, 255, 0.9);
  }

</style>
</head>
<body>

  <div class="glass-box">
    <h2>Stock Artwork</h2>
    <p>
      This is the reusable glass panel — rounded corners, a frosted blur behind it,
      a bright top highlight to fake a light reflection, and a soft glow underneath.
      Drop any content inside it.
    </p>
  </div>

</body>
</html>
